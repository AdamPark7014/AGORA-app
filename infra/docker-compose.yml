name: agora

services:
  postgres:
    image: postgres:17-alpine
    container_name: agora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora_local_dev
      POSTGRES_DB: agora
    # Solo en esta maquina: con la contrasena fija de desarrollo, publicar en
    # 0.0.0.0 dejaba la base abierta a cualquiera en la misma red (WiFi del campus).
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - agora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agora -d agora']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: agora-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    ports:
      - '127.0.0.1:6382:6379'
    volumes:
      - agora-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  agora-postgres:
  agora-redis:
