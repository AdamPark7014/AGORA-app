name: ios-capturas

# Capturas de iOS para App Store (6.9", 1320x2868), en claro y en oscuro, con el
# seed de demo (fotos y clips de packages/db/prisma/demo-media): inicio, feed, clips,
# evento, aventones, mercado, mensajes y perfil. Una segunda pasada vacía la base y
# captura el inicio sin contenido, que es lo que se ve en un campus nuevo. Postgres y
# la API corren en el mismo Mac del CI, en modo desarrollo; nada toca
# produccion. La misma prueba recorre el registro de una cuenta nueva y comprueba
# la casilla de terminos (Apple 1.2). Las capturas salen en el artefacto
# ios-capturas-tienda; scripts/tienda/enmarcar.py las enmarca.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/mobile-native/ios/**'
      - '.github/workflows/ios-capturas.yml'
      - '.github/scripts/capturas-preparar.py'
      - 'packages/db/prisma/demo-seed.ts'
      - 'packages/db/prisma/demo-media/**'
      - 'apps/api/src/media/**'
      - 'scripts/bienvenida/**'

concurrency:
  group: ios-capturas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      NODE_ENV: development
      DATABASE_URL: postgresql://agora:agora_ci@127.0.0.1:5432/agora?schema=public
      DIRECT_DATABASE_URL: postgresql://agora:agora_ci@127.0.0.1:5432/agora?schema=public
      SESSION_SECRET: ci-capturas-secret-minimo-32-caracteres!!
      MAIL_PROVIDER: console
      MAIL_FROM: 'Ágora <ci@udlagora.com>'
      API_PORT: '4200'
      MODERACION_OPCIONAL: 'true'
      VERIFICAR_BUZON_UDLAP: 'off'
      DEV_OTP_MAESTRO: '123456'
      DEV_OTP_CORREOS: 'prueba.uno@udlap.mx,prueba.registro@udlap.mx'
      WEB_URL: http://127.0.0.1:3200
      NEXT_PUBLIC_WEB_URL: http://127.0.0.1:3200
      API_URL: http://127.0.0.1:4200
    steps:
      - uses: actions/checkout@v4
      # El mismo SDK que TestFlight (iOS 26): con el SDK anterior la barra nativa de TabView
      # sí se ocultaba y el problema de la 1.0.0 (5) no se veía aquí.
      - name: Xcode más reciente (el de TestFlight)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Postgres 17 y XcodeGen
        run: |
          brew install postgresql@17 xcodegen
          PG="$(brew --prefix postgresql@17)/bin"
          echo "$PG" >> "$GITHUB_PATH"
          "$PG/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust > /dev/null
          "$PG/pg_ctl" -D "$RUNNER_TEMP/pg" -l "$RUNNER_TEMP/pg.log" -o "-p 5432 -h 127.0.0.1" -w start
          "$PG/psql" -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE agora LOGIN PASSWORD 'agora_ci' CREATEDB;" \
            -c "CREATE DATABASE agora OWNER agora;"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias, migraciones y build de la API
        run: |
          pnpm install --frozen-lockfile
          pnpm db:generate
          pnpm db:migrate:deploy
          pnpm exec turbo run build --filter=@agora/api...

      # El seed pone horas «locales» (fiesta a las 22, aventón a las 7) y la app
      # las muestra en hora de México: en UTC salían a las 16:00 y a la 1:00.
      - name: Seed (catálogo UDLAP + demo)
        env:
          TZ: America/Mexico_City
        run: pnpm db:seed

      - name: API en 127.0.0.1:4200
        run: |
          nohup pnpm --filter @agora/api start > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4200/api/salud > /dev/null && { echo "API lista (intento $i)"; exit 0; }
            sleep 2
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Cuenta demo e ids del seed
        run: python3 .github/scripts/capturas-preparar.py

      - name: Simulador de 6.9 pulgadas
        working-directory: apps/mobile-native/ios
        run: |
          xcodegen generate
          DEV=$(xcrun simctl list devices available | grep -m1 -E 'iPhone 1[67] Pro Max \(' | sed -E 's/.*\(([A-F0-9-]{36})\).*/\1/')
          if [ -z "$DEV" ]; then
            RT=$(xcrun simctl list runtimes available | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]*' | tail -1)
            DEV=$(xcrun simctl create "Capturas 6.9" com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro-Max "$RT")
          fi
          xcrun simctl list devices | grep "$DEV"
          echo "DEV=$DEV" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          # Barra de estado de ficha: 9:41, batería llena, señal completa.
          xcrun simctl status_bar "$DEV" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100

      - name: Capturas y registro (XCUITest contra la API de demo)
        working-directory: apps/mobile-native/ios
        env:
          TEST_RUNNER_AGORA_CAPTURAS: ${{ github.workspace }}/capturas-ios
          TEST_RUNNER_AGORA_API_URL: http://127.0.0.1:4200/api
          TEST_RUNNER_AGORA_DEMO_MAESTRO: '123456'
          TEST_RUNNER_AGORA_REGISTRO_CORREO: prueba.registro@udlap.mx
        # Firma local («-», sin equipo ni certificado): sin firma, el simulador no
        # deja escribir en el Keychain y la sesión no se guarda (la app vuelve a
        # la puerta después de entrar). pruebas-ui no lo nota porque nunca entra.
        run: |
          set -o pipefail
          xcodebuild test \
            -project AgoraApp.xcodeproj \
            -scheme AgoraApp \
            -destination "id=$DEV" \
            -only-testing:AgoraAppUITests/CapturasTiendaUITests \
            -resultBundlePath "$RUNNER_TEMP/capturas.xcresult" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AGORA_CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee xcodebuild-capturas.log | grep -E "Test Case .*(passed|failed|skipped)|error:|\*\* TEST (SUCCEEDED|FAILED)"

      # Lo que ve quien entra a un campus sin publicaciones (producción el 26-10-2026): se borran
      # publicaciones, eventos, anuncios y aventones (todo en cascada) y se captura el inicio.
      - name: Inicio sin contenido (segunda pasada, base vacía)
        working-directory: apps/mobile-native/ios
        env:
          TEST_RUNNER_AGORA_CAPTURAS: ${{ github.workspace }}/capturas-ios
          TEST_RUNNER_AGORA_API_URL: http://127.0.0.1:4200/api
          TEST_RUNNER_AGORA_INICIO_VACIO: '1'
        run: |
          set -o pipefail
          # Sin la URL de Prisma: libpq rechaza su parámetro `?schema=`.
          PGPASSWORD=agora_ci psql -h 127.0.0.1 -U agora -d agora -v ON_ERROR_STOP=1 \
            -c "DELETE FROM posts;" -c "DELETE FROM eventos;" -c "DELETE FROM anuncios;" -c "DELETE FROM aventones;"
          xcodebuild test \
            -project AgoraApp.xcodeproj \
            -scheme AgoraApp \
            -destination "id=$DEV" \
            -only-testing:AgoraAppUITests/CapturasTiendaUITests/test3_inicioVacio \
            -resultBundlePath "$RUNNER_TEMP/capturas-vacio.xcresult" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AGORA_CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee xcodebuild-capturas-vacio.log | grep -E "Test Case .*(passed|failed|skipped)|error:|\*\* TEST (SUCCEEDED|FAILED)"

      # Lo que ve una cuenta nueva en producción desde el 28-10-2026: la base vacía más la
      # bienvenida de la cuenta oficial @agora, publicada con los mismos guiones que allá.
      - name: Inicio con la bienvenida de @agora (tercera pasada)
        working-directory: apps/mobile-native/ios
        env:
          TEST_RUNNER_AGORA_CAPTURAS: ${{ github.workspace }}/capturas-ios
          TEST_RUNNER_AGORA_API_URL: http://127.0.0.1:4200/api
          TEST_RUNNER_AGORA_INICIO_BIENVENIDA: '1'
        run: |
          set -o pipefail
          clave=$(python3 -c 'import secrets; print(secrets.token_urlsafe(18))')
          echo "::add-mask::$clave"
          correo=agora.oficial.ci@udlap.mx
          printf 'CORREO: %s\nCONTRASEÑA: %s\n' "$correo" "$clave" > "$RUNNER_TEMP/cuenta-oficial.txt"
          printf '%s\t%s' "$correo" "$clave" \
            | AGORA_API_DIR="$GITHUB_WORKSPACE/apps/api" node "$GITHUB_WORKSPACE/scripts/bienvenida/crear-cuenta-oficial.mjs"
          python3 "$GITHUB_WORKSPACE/scripts/bienvenida/publicar.py" --api http://127.0.0.1:4200/api \
            --cuenta "$RUNNER_TEMP/cuenta-oficial.txt" --espera-clip 30
          xcodebuild test \
            -project AgoraApp.xcodeproj \
            -scheme AgoraApp \
            -destination "id=$DEV" \
            -only-testing:AgoraAppUITests/CapturasTiendaUITests/test4_inicioBienvenida \
            -resultBundlePath "$RUNNER_TEMP/capturas-bienvenida.xcresult" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- AGORA_CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee xcodebuild-capturas-bienvenida.log | grep -E "Test Case .*(passed|failed|skipped)|error:|\*\* TEST (SUCCEEDED|FAILED)"

      - name: Capturas de 1320x2868
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE/capturas-ios" || { echo "::error::No hay capturas"; exit 1; }
          fallo=0
          for tema in claro oscuro; do
            for nombre in inicio feed clips publicar cartelera evento aventones mercado anuncio perfil-yo campus mensajes avisos directorio perfil inicio-vacio inicio-bienvenida inicio-bienvenida-2; do
              f="$tema/$nombre.png"
              if [ ! -f "$f" ]; then echo "::error::Falta $f"; fallo=1; continue; fi
              w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
              h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
              echo "$f ${w}x${h}"
              if [ "$w" != 1320 ] || [ "$h" != 2868 ]; then echo "::error::$f mide ${w}x${h}"; fallo=1; fi
            done
          done
          ls -la registro 2>/dev/null || true
          exit $fallo

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-capturas-tienda
          path: |
            capturas-ios
            apps/mobile-native/ios/xcodebuild-capturas.log
            apps/mobile-native/ios/xcodebuild-capturas-vacio.log
            apps/mobile-native/ios/xcodebuild-capturas-bienvenida.log
            ${{ runner.temp }}/api.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-capturas-xcresult
          path: |
            ${{ runner.temp }}/capturas.xcresult
            ${{ runner.temp }}/capturas-vacio.xcresult
            ${{ runner.temp }}/capturas-bienvenida.xcresult
          if-no-files-found: ignore
