# Ágora — verificación formal (A6-2)
# Sin continue-on-error ni || true. El job falla si cualquier paso falla.
name: ci

on:
  push:
    branches: [master, 'mejora/**']
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · types · unit · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agora
          POSTGRES_PASSWORD: agora_ci
          POSTGRES_DB: agora
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agora -d agora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CI: 'true'
      AGORA_PSQL_DIRECT: '1'
      NODE_ENV: development
      DATABASE_URL: postgresql://agora:agora_ci@localhost:5432/agora?schema=public
      DIRECT_DATABASE_URL: postgresql://agora:agora_ci@localhost:5432/agora?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-minimo-32-caracteres!!
      MAIL_PROVIDER: console
      MAIL_FROM: 'Ágora <ci@udlagora.com>'
      NEXT_PUBLIC_WEB_URL: http://localhost:3200
      NEXT_PUBLIC_ADMIN_URL: http://localhost:3300
      NEXT_PUBLIC_API_URL: http://localhost:4200/api
      API_INTERNA: http://localhost:4200
      API_PORT: '4200'
      MODERACION_OPCIONAL: 'true'
      DEV_OTP_MAESTRO: '123456'
      DEV_OTP_CORREOS: 'adam.delpozoos@udlap.mx,prueba.uno@udlap.mx,prueba.dos@udlap.mx'
      WEB_URL: http://localhost:3200
      ADMIN_URL: http://localhost:3300
      API_URL: http://localhost:4200
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: agora_ci
      POSTGRES_DB: agora

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cliente PostgreSQL (e2e → psql)
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Prisma generate + migrate deploy (19 migraciones)
        run: |
          pnpm db:generate
          pnpm db:migrate:deploy

      - name: Sembrar catálogo UDLAP
        run: pnpm db:seed

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Build (unit tests corren sobre dist/)
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Instalar Chromium Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Arrancar API + web + admin
        run: |
          pnpm --filter @agora/api start > /tmp/agora-api.log 2>&1 &
          pnpm --filter @agora/web start > /tmp/agora-web.log 2>&1 &
          pnpm --filter @agora/admin start > /tmp/agora-admin.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4200/api/salud >/dev/null \
              && curl -sf http://localhost:3200/ >/dev/null \
              && curl -sf http://localhost:3300/ >/dev/null; then
              echo "Servicios listos en intento $i"
              exit 0
            fi
            sleep 2
          done
          echo "=== API ===" && cat /tmp/agora-api.log || true
          echo "=== WEB ===" && cat /tmp/agora-web.log || true
          echo "=== ADMIN ===" && cat /tmp/agora-admin.log || true
          exit 1

      - name: E2E Playwright (8 specs)
        run: pnpm test:e2e

      - name: Logs si falló e2e
        if: failure()
        run: |
          echo "=== API ===" && tail -n 200 /tmp/agora-api.log || true
          echo "=== WEB ===" && tail -n 200 /tmp/agora-web.log || true
          echo "=== ADMIN ===" && tail -n 200 /tmp/agora-admin.log || true
