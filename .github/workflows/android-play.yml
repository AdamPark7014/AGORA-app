name: Android · Play

# Android App Bundle (.aab) de Ágora firmado con la llave de SUBIDA de Google Play
# (Play App Signing guarda la llave final de la app). La llave vive en los secretos
# del repositorio (los carga scripts/subir-secretos-android.ps1; la crea
# scripts/crear-llave-android.ps1) y en %USERPROFILE%\Documents\LLAVES-ANDROID\AGORA
# de Adam; nunca en el repositorio ni en los registros. Solo a mano: cada subida a
# Play necesita un versionCode nuevo (Play no repite ninguno, ni los de bundles
# descartados). La primera subida a Play Console es manual (ver docs/store/README.md).
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión visible (versionName), p. ej. 1.0.0'
        required: true
        default: '1.0.0'
        type: string
      build:
        description: 'versionCode (entero creciente). Vacío = número de esta corrida (github.run_number)'
        required: false
        default: ''
        type: string

concurrency:
  group: android-play-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  aab:
    name: AAB firmado
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile-native/android
    env:
      APP_VERSION: ${{ inputs.version }}
      APP_BUILD_NUMBER: ${{ inputs.build != '' && inputs.build || github.run_number }}
      # Alias y contraseñas de la llave de subida en el entorno del job: build.gradle.kts
      # los lee con System.getenv al firmar. La ruta del .jks la fija el paso «Llave de subida».
      AGORA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      AGORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      AGORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos y versión
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          faltan=()
          [ -n "$ANDROID_UPLOAD_KEYSTORE_BASE64" ] || faltan+=(ANDROID_UPLOAD_KEYSTORE_BASE64)
          [ -n "$AGORA_KEYSTORE_PASSWORD" ] || faltan+=(ANDROID_KEYSTORE_PASSWORD)
          [ -n "$AGORA_KEY_ALIAS" ] || faltan+=(ANDROID_KEY_ALIAS)
          [ -n "$AGORA_KEY_PASSWORD" ] || faltan+=(ANDROID_KEY_PASSWORD)
          if [ "${#faltan[@]}" -gt 0 ]; then
            echo "::error::Faltan los secretos ${faltan[*]} en el repositorio. Cárgalos con scripts/subir-secretos-android.ps1 (la llave la crea scripts/crear-llave-android.ps1)."
            exit 1
          fi
          if ! [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::La versión «$APP_VERSION» no tiene la forma MAYOR.MENOR.PARCHE."
            exit 1
          fi
          if ! [[ "$APP_BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::El versionCode «$APP_BUILD_NUMBER» debe ser un entero positivo."
            exit 1
          fi
          echo "versionName=$APP_VERSION versionCode=$APP_BUILD_NUMBER"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Llave de subida (archivo temporal del job)
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          umask 177
          ruta="$RUNNER_TEMP/agora-upload.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > "$ruta"
          test -s "$ruta" || { echo '::error::El keystore decodificado quedó vacío.'; exit 1; }
          # Que la llave abra con el alias y las contraseñas de los secretos antes de gastar minutos compilando.
          # Las contraseñas viajan a keytool por variable de entorno (-storepass:env), no en la línea de comandos.
          keytool -list -keystore "$ruta" -storepass:env AGORA_KEYSTORE_PASSWORD -alias "$AGORA_KEY_ALIAS" > /dev/null
          echo "AGORA_KEYSTORE_PATH=$ruta" >> "$GITHUB_ENV"

      - name: Compilar AAB de release (bundleRelease, R8)
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease "-PVERSION_CODE=$APP_BUILD_NUMBER" "-PVERSION_NAME=$APP_VERSION" --no-daemon --console=plain

      - name: Verificar que el AAB va firmado con la llave de subida (no con la de debug)
        run: |
          huella() { grep -m1 -oE 'SHA256: *([0-9A-F]{2}:){31}[0-9A-F]{2}' | sed 's/SHA256: *//'; }
          aab=app/build/outputs/bundle/release/app-release.aab
          test -f "$aab" || { echo "::error::No se generó $aab"; exit 1; }
          h_aab=$(keytool -printcert -jarfile "$aab" | huella)
          h_subida=$(keytool -list -v -keystore "$AGORA_KEYSTORE_PATH" -storepass:env AGORA_KEYSTORE_PASSWORD -alias "$AGORA_KEY_ALIAS" | huella)
          echo "AAB:    ${h_aab:-sin firma}"
          echo "Subida: $h_subida"
          [ -n "$h_aab" ] || { echo '::error::El AAB no está firmado.'; exit 1; }
          [ -n "$h_subida" ] || { echo '::error::No se pudo leer la huella de la llave de subida.'; exit 1; }
          [ "$h_aab" = "$h_subida" ] || { echo '::error::La firma del AAB no coincide con la llave de subida.'; exit 1; }
          {
            echo '## Ágora · AAB listo para Play'
            echo "- versionName: \`$APP_VERSION\` · versionCode: \`$APP_BUILD_NUMBER\`"
            echo "- Certificado de la llave de subida (SHA-256): \`$h_aab\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: agora-aab
          path: |
            apps/mobile-native/android/app/build/outputs/bundle/release/app-release.aab
            apps/mobile-native/android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Borrar la llave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/agora-upload.jks"
