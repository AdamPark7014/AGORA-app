# Ágora — udlagora.com
#   docker compose -f deploy/docker-compose.yml up -d --build

name: agora

networks:
  internal:
    name: agora_internal
  proxy:
    external: true
    name: proxy

volumes:
  agora_pg:
  agora_redis:
  agora_minio:

services:
  db:
    image: postgres:17-alpine
    container_name: agora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-America/Mexico_City}
    volumes:
      - agora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: agora-redis
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - agora_redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  minio:
    # Tag concreto (no :latest). Ultimo push oficial a Docker Hub; IAM dedicado = fase siguiente.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: agora-minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - agora_minio:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
      - proxy

  minio-init:
    # Tag concreto (no :latest). Imagen mc sin sed → anonymous set download.
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: agora-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # Solo lectura publica (GetObject). Equivale a deploy/minio/bucket-policy.json
    # (referencia; no se monta: mc no trae sed y set-json+plantilla rompia el init).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      (mc ls local/$$S3_BUCKET >/dev/null 2>&1 || mc mb -p local/$$S3_BUCKET) &&
      mc anonymous set download local/$$S3_BUCKET
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    networks:
      - internal
    restart: 'no'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: agora-api:latest
    container_name: agora-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --dns-result-order=ipv4first
      API_PORT: '4200'
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET}
      MAIL_PROVIDER: ${MAIL_PROVIDER}
      BREVO_API_KEY: ${BREVO_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      # Webhook de entregas de Brevo; vacio = la ruta no existe.
      CORREO_WEBHOOK_TOKEN: ${CORREO_WEBHOOK_TOKEN:-}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      TRUST_PROXY: 'true'
      # Sin default true: el bypass de IA debe ser explicito en deploy/.env.
      # Si falta OPENAI_API_KEY y no hay MODERACION_OPCIONAL=true, la API no arranca.
      MODERACION_OPCIONAL: ${MODERACION_OPCIONAL:-}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: auto
      S3_PUBLIC_URL: ${S3_PUBLIC_URL}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contacto@udlagora.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      APNS_SIGNING_KEY: ${APNS_SIGNING_KEY:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4200/api/salud').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - proxy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: agora-web:latest
    container_name: agora-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNA: http://agora-api:4200
      PORT: '3200'
      HOSTNAME: 0.0.0.0
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
      - proxy
