## Traefik — udlagora.com (Ágora)
## La web reenvía /api/* a la API interna; Traefik solo expone el front y el bucket de media.

http:
  routers:
    udlagora-http:
      rule: Host(`udlagora.com`)
      entryPoints: [web]
      middlewares: [redirect-https-udlagora]
      service: dummy-udlagora

    udlagora-api:
      rule: Host(`udlagora.com`) && PathPrefix(`/api`)
      entryPoints: [websecure]
      service: agora-api
      priority: 200
      tls:
        certResolver: letsencrypt

    udlagora-https:
      rule: Host(`udlagora.com`)
      service: agora-web
      entryPoints: [websecure]
      priority: 50
      tls:
        certResolver: letsencrypt

    # Solo lectura: GET/HEAD de archivos. Sin el filtro de metodo, toda la API
    # S3 de MinIO (subir, borrar, administrar) quedaba alcanzable desde internet
    # en el mismo origen que la app; la clave la frenaba, pero no deberia
    # depender solo de eso.
    udlagora-media:
      rule: Host(`udlagora.com`) && PathPrefix(`/media`) && (Method(`GET`) || Method(`HEAD`))
      service: agora-minio
      entryPoints: [websecure]
      middlewares: [strip-media-prefix, media-cabeceras]
      priority: 200
      tls:
        certResolver: letsencrypt

  middlewares:
    redirect-https-udlagora:
      redirectScheme:
        scheme: https
        permanent: true

    strip-media-prefix:
      stripPrefix:
        prefixes: ['/media']

    # Las cabeceras de next.config no aplican a /media (no pasa por Next).
    media-cabeceras:
      headers:
        customResponseHeaders:
          X-Content-Type-Options: nosniff
          Content-Security-Policy: "default-src 'none'; sandbox"

  services:
    agora-api:
      loadBalancer:
        healthCheck:
          path: /api/salud
          interval: 10s
          timeout: 3s
        servers:
          - url: 'http://agora-api:4200'

    agora-web:
      loadBalancer:
        healthCheck:
          path: /
          interval: 10s
          timeout: 3s
        servers:
          - url: 'http://agora-web:3200'

    agora-minio:
      loadBalancer:
        servers:
          - url: 'http://agora-minio:9000'

    dummy-udlagora:
      loadBalancer:
        servers:
          - url: 'http://localhost'
