name: AgoraApp
options:
  bundleIdPrefix: mx.agora.mobile
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  AgoraApp:
    type: application
    platform: iOS
    sources:
      - path: AgoraApp
      - path: Resources/Assets.xcassets
    entitlements:
      path: Resources/AgoraApp.entitlements
    info:
      path: Resources/Info.plist
      properties:
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: mx.agora.mobile
            CFBundleURLSchemes:
              - agora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.agora.mobile.AgoraApp
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AgoraAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgoraAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.agora.mobile.AgoraAppTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AgoraApp
