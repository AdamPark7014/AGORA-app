name: AgoraApp
options:
  bundleIdPrefix: mx.agora.mobile
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    # Xcode solo acepta 4.0 / 4.2 / 5.0 / 6.0 aquí; "5.0" = modo de lenguaje Swift 5.
    SWIFT_VERSION: "5.0"
    # La versión real la inyecta «iOS · TestFlight» por línea de órdenes
    # (MARKETING_VERSION de la entrada, CURRENT_PROJECT_VERSION del número de
    # corrida). Estos valores solo sirven para compilar en local y en simulador.
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"

targets:
  AgoraApp:
    type: application
    platform: iOS
    sources:
      - path: AgoraApp
      - path: Resources/Assets.xcassets
      # Manifiesto de privacidad: va a la raíz del .app (Apple lo exige desde 2024).
      - path: Resources/PrivacyInfo.xcprivacy
    entitlements:
      path: Resources/AgoraApp.entitlements
    # Firma (estilo, equipo, perfil) en el xcconfig: el flujo de TestFlight la
    # sobreescribe (Config/AgoraApp.signing.xcconfig) sin tocar este archivo.
    configFiles:
      Debug: Config/AgoraApp.xcconfig
      Release: Config/AgoraApp.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.agora.mobile.AgoraApp
        # Solo iPhone. Declarar iPad obliga a subir capturas de 13" y a hacer QA en
        # iPad, y Apple revisa ahí (NEXARA y ARTA se rechazaron por eso). Se vuelve
        # a "1,2" cuando exista una versión pensada para iPad.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Info.plist se mantiene a mano (permisos de fotos y cámara, esquema
        # agora://, modos de fondo, nombre «Ágora»): XcodeGen no lo regenera.
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: false
        # XcodeGen deja «iPhone Developer» a nivel de target y eso le gana al
        # xcconfig: la identidad sale de una variable de Config/AgoraApp.xcconfig
        # (o del *.signing.xcconfig que escribe el flujo de TestFlight).
        CODE_SIGN_IDENTITY: $(AGORA_CODE_SIGN_IDENTITY)
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": $(AGORA_CODE_SIGN_IDENTITY)
      configs:
        # APNs distingue entornos: TestFlight y App Store usan SIEMPRE production.
        Debug:
          CODE_SIGN_ENTITLEMENTS: Resources/AgoraApp.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Resources/AgoraApp.Release.entitlements

  # Pruebas de interfaz en el simulador contra una API falsa (ios.yml →
  # pruebas-ui): tocan los botones en el borde, donde antes no respondían.
  AgoraAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AgoraAppUITests
    dependencies:
      - target: AgoraApp
    settings:
      base:
        TEST_TARGET_NAME: AgoraApp
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: mx.agora.mobile.AgoraAppUITests
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO

  AgoraAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AgoraAppTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mx.agora.mobile.AgoraAppTests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: AgoraApp

# XcodeGen no crea esquemas compartidos por su cuenta, y `xcodebuild -scheme`
# (el archivado de TestFlight) solo ve los compartidos.
schemes:
  AgoraApp:
    build:
      targets:
        AgoraApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgoraAppTests
        - AgoraAppUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
